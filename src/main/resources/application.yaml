server:
  port: 8181

spring:
  application:
    name: owasp-playground

  datasource:
    url: jdbc:h2:mem:securedb
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  h2:
    console:
      enabled: false # DISABLE IN PRODUCTION!
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized