server:
  port: 8181

spring:
  application:
    name: owasp-playground

  datasource:
    url: jdbc:h2:mem:securedb
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always


app:
  stripe:
    api-key-live: sk_live_1234567890abcdef # Sanitizer catches "key"
  internal:
    dbConnectionString: jdbc:postgresql://prod-db:5432/app?user=admin&pass=SuperSecret123 # Sanitizer MISSES this!